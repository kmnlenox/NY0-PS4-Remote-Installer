name: Build NY0 PS4 package

on:
  push:
    branches:
      - main
      - implementation/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build diagnostic PS4 package
        uses: OpenOrbis/toolchain-action@v0.5.4
        with:
          version: v0.5.4
          command: cd ps4 && make

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ny0-ps4-diagnostic-build
          path: |
            ps4/*.pkg
            ps4/eboot.bin
          if-no-files-found: error
          retention-days: 14
