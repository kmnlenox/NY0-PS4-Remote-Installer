name: Build NY0 PS4 package

on:
  push:
    branches:
      - main
      - implementation/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build with the OpenOrbis toolchain container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -w /workspace/ps4 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            openorbisofficial/toolchain:latest \
            bash -lc "echo '=== container OS and interpreters ==='; cat /etc/os-release; command -v python python3 pypy3 || true; ls -l /usr/bin/python* 2>/dev/null || true; echo '=== make_fself.py source ==='; sed -n '1,260p' /lib/OpenOrbisSDK/scripts/make_fself.py; echo '=== template GP4 remainder ==='; sed -n '1,260p' /lib/OpenOrbisSDK/bin/data/template.gp4; echo '=== SDK bin contents ==='; ls -la /lib/OpenOrbisSDK/bin/linux; make"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ny0-ps4-diagnostic-build
          path: |
            ps4/*.pkg
            ps4/eboot.bin
          if-no-files-found: error
          retention-days: 14
