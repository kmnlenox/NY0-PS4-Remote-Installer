name: Build NY0 PS4 package

on:
  push:
    branches:
      - main
      - implementation/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build with the OpenOrbis toolchain container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -w /workspace/ps4 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            openorbisofficial/toolchain:latest \
            bash -lc "echo '=== make_fself.py help ==='; python3 /lib/OpenOrbisSDK/scripts/make_fself.py --help || true; echo '=== PkgTool help ==='; /lib/OpenOrbisSDK/bin/linux/PkgTool.Core --help || true; echo '=== packaging scripts ==='; find /lib/OpenOrbisSDK -maxdepth 4 -type f | grep -Ei 'gp4|pkg|fself' | sort; echo '=== template GP4 ==='; sed -n '1,220p' /lib/OpenOrbisSDK/bin/data/template.gp4; make"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ny0-ps4-diagnostic-build
          path: |
            ps4/*.pkg
            ps4/eboot.bin
          if-no-files-found: error
          retention-days: 14
