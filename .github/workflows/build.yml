name: Build NY0 PS4 homebrew package

on:
  push:
    branches:
      - main
      - implementation/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go for the OpenOrbis GP4 generator
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build create-gp4 from the official OpenOrbis source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/OpenOrbis/create-gp4.git "$RUNNER_TEMP/create-gp4-source"
          mkdir -p "$GITHUB_WORKSPACE/ps4/tools"
          cd "$RUNNER_TEMP/create-gp4-source/cmd/create-gp4"
          go build -trimpath -o "$GITHUB_WORKSPACE/ps4/tools/create-gp4" .
          test -x "$GITHUB_WORKSPACE/ps4/tools/create-gp4"
          "$GITHUB_WORKSPACE/ps4/tools/create-gp4" -h
          git clone --depth 1 https://github.com/OpenOrbis/create-fself.git "$RUNNER_TEMP/create-fself-source"
          cd "$RUNNER_TEMP/create-fself-source/cmd/create-fself"
          cp go-linux.mod go.mod
          go build -trimpath -o "$GITHUB_WORKSPACE/ps4/tools/create-fself" .
          test -x "$GITHUB_WORKSPACE/ps4/tools/create-fself"

      - name: Generate required PS4 app icon
        run: |
          set -euo pipefail
          python3 tools/make_icon.py
          file sce_sys/icon0.png
          test -s sce_sys/icon0.png
        working-directory: ps4

      - name: Inspect SDK runtime asset locations
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm openorbisofficial/toolchain:latest bash -lc "echo SDK root; ls -la /lib/OpenOrbisSDK; echo Candidate runtime files; find /lib/OpenOrbisSDK -type f -name right.sprx -o -type f -name libc.prx -o -type f -name libSceFios2.prx"
 
      - name: Build NY0 and isolated minimal launch-test packages
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -w /workspace/ps4 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            openorbisofficial/toolchain:latest \
            bash -lc 'set -euo pipefail
              export OO_PS4_TOOLCHAIN=/lib/OpenOrbisSDK
              test -x tools/create-gp4
              test -x tools/create-fself
              test -x "/lib/OpenOrbisSDK/bin/linux/PkgTool.Core"
              mkdir -p web
              cp -R /workspace/web/. web/
              test -s web/index.html
              test -s web/style.css
              test -s web/app.js
              # OpenOrbis sample runtime assets required by normal app packages.
              # Use the SDK's own known-good files rather than fabricated placeholders.
              test -s "/lib/OpenOrbisSDK/bin/data/right.sprx"
              test -s "/lib/OpenOrbisSDK/bin/data/modules/libc.prx"
              test -s "/lib/OpenOrbisSDK/bin/data/modules/libSceFios2.prx"
              mkdir -p sce_sys/about sce_module
              cp "/lib/OpenOrbisSDK/bin/data/right.sprx" sce_sys/about/right.sprx
              cp "/lib/OpenOrbisSDK/bin/data/modules/libc.prx" sce_module/libc.prx
              cp "/lib/OpenOrbisSDK/bin/data/modules/libSceFios2.prx" sce_module/libSceFios2.prx
              make clean
              make
              "/lib/OpenOrbisSDK/bin/linux/PkgTool.Core" pkg_validate IV0000-NYOR00001_00-NY0REMOTEINSTALL.pkg
              sha256sum IV0000-NYOR00001_00-NY0REMOTEINSTALL.pkg
              ls -lh IV0000-NYOR00001_00-NY0REMOTEINSTALL.pkg eboot.bin

              # Build a separate, tiny app using the same official SDK pipeline.
              # It has no NY0 code, sockets, C++ features, or system-service calls.
              cd diagnostics/launch_test
              mkdir -p tools sce_sys
              cp ../../tools/create-gp4 tools/create-gp4
              cp ../../tools/create-fself tools/create-fself
              cp ../../sce_sys/icon0.png sce_sys/icon0.png
              mkdir -p sce_sys/about sce_module
              cp ../../sce_sys/about/right.sprx sce_sys/about/right.sprx
              cp ../../sce_module/libc.prx sce_module/libc.prx
              cp ../../sce_module/libSceFios2.prx sce_module/libSceFios2.prx
              make clean
              make
              "/lib/OpenOrbisSDK/bin/linux/PkgTool.Core" pkg_validate IV0000-NYOD00001_00-NY0LAUNCHTEST000.pkg
              ls -lh IV0000-NYOD00001_00-NY0LAUNCHTEST000.pkg eboot.bin
              cp IV0000-NYOD00001_00-NY0LAUNCHTEST000.pkg ../../NY0-LAUNCH-TEST.pkg
              cp eboot.bin ../../NY0-LAUNCH-TEST-eboot.bin'
        working-directory: ps4

      - name: Verify NY0 PKG header fields used by the runtime BGFT manifest builder
        run: python3 tools/verify_pkg_header.py IV0000-NYOR00001_00-NY0REMOTEINSTALL.pkg
        working-directory: ps4

      - name: Upload NY0 installer package
        uses: actions/upload-artifact@v4
        with:
          name: ny0-remote-installer-fpkg
          path: |
            ps4/IV0000-NYOR00001_00-NY0REMOTEINSTALL.pkg
            ps4/eboot.bin
          if-no-files-found: error
          retention-days: 14

      - name: Upload isolated PS4 launch test
        uses: actions/upload-artifact@v4
        with:
          name: ny0-minimal-launch-test
          path: |
            ps4/NY0-LAUNCH-TEST.pkg
            ps4/NY0-LAUNCH-TEST-eboot.bin
          if-no-files-found: error
          retention-days: 14
